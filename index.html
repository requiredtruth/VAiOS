  async function runAIEditToolLoop(item,editPrompt,out,maxTurns){
    const ctx={source:String(item.html||''),changed:false,changeCount:0};
    out.sourceBox.value=ctx.source;
    const messages=[
      {role:'system',content:AI_EDIT_TOOL_PROMPT},
      {role:'user',content:makeInitialEditContext(item,editPrompt,ctx.source)}
    ];
    for(let turn=1;turn<=maxTurns;turn++){
      out.status.textContent='Tool turn '+turn+' of '+maxTurns+'...';
      appendToolLog(out.logBox,'\n===== AI TURN '+turn+' =====');
      const raw=await askAIConversationOnce(messages,out,out.logBox,'Tool Edit Turn '+turn);
      const parsed=parseEditToolResponses(raw);
      appendToolLog(out.logBox,'AI TOOL/FINAL:\n'+raw.trim());
      if(!parsed.tools.length){
        if(!ctx.changed&&looksLikeHtml(raw))throw new Error('AI returned full HTML instead of tool calls. Refused to replace the source.');
        out.status.textContent='AI stopped using tools. '+String(parsed.final||'Done.');
        return {html:ctx.source,changed:ctx.changed,final:parsed.final||raw};
      }
      const results=[];
      parsed.tools.forEach((toolCall,idx)=>{
        const label='TOOL '+(idx+1)+'/'+parsed.tools.length+' '+String(toolCall.tool||'').toUpperCase();

      });
      out.sourceBox.value=ctx.source;
      messages.push({role:'assistant',content:raw});
      messages.push({role:'user',content:'TOOL RESULTS FOR TURN '+turn+':\n'+results.join('\n\n')+'\n\nCurrent source lines: '+ctx.source.split('\n').length+'. Current change count: '+ctx.changeCount+'.\nContinue with the next tool call or multiple tool calls. JSON arrays and multiple LongCat tool blocks are accepted. When finished, return {"final":"done - summary"} or a plain done summary with no tool call. Do not return the full HTML.'});
    }
    out.status.textContent='Max tool turns reached.';
    return {html:ctx.source,changed:ctx.changed,final:'max turns reached'};
  }


  async function askAIConversationOnce(messages,out,box,stageName){
    const s=getSettings();
    const endpoint=normalizeEndpoint(s.llmUrl);
    if(!endpoint)throw new Error('No LLM URL saved. Open Settings first.');
    const body={model:s.model||'local-model',temperature:Number(s.temperature||0.25),messages:messages};
    out.status.textContent=stageName+'\nCalling '+endpoint+'\nStreaming if server supports it...';
    let text='';
    try{
      const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({},body,{stream:true}))});
      if(res.ok&&res.body&&res.body.getReader){
        text=await readStream(res,box);
      }else{
        const err=await res.text();
        throw new Error('stream rejected: HTTP '+res.status+' '+err.slice(0,400));
      }
    }catch(streamErr){
      appendToolLog(box,'Streaming failed/rejected. Retrying non-stream: '+cleanError(streamErr));
      const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({},body,{stream:false}))});
      const raw=await res.text();
      if(!res.ok)throw new Error('HTTP '+res.status+' '+raw);
      text=extractAssistantToolText(raw);
      appendToolLog(box,text);
    }
    text=stripRouterChatter(stripFences(text));
    return text.trim();
  }

  function extractAssistantToolText(data){
    let obj=null;
    if(typeof data==='string'){try{obj=JSON.parse(data)}catch(e){return data}}
    else obj=data;
    try{
      const c=obj&&obj.choices&&obj.choices[0];
      const msg=c&&c.message;
      if(msg&&Array.isArray(msg.tool_calls)&&msg.tool_calls.length){
        const calls=msg.tool_calls.map(tc=>{
          const fn=tc.function||{};
          let args={};
          try{args=typeof fn.arguments==='string'?JSON.parse(fn.arguments):(fn.arguments||{})}catch(e){args={rawArguments:fn.arguments||''}}

  function allJsonObjects(text){

  function systemLLMEndpointList(){
    const saved=normalizeEndpoint((getSettings()||{}).llmUrl||'http://127.0.0.1:8205');
    const raw=[saved,normalizeEndpoint('http://127.0.0.1:8205'),normalizeEndpoint('http://localhost:8205')];

  async function askSystemLLMPlain(systemPrompt,userPrompt,kind,statusEl){
    kind=String(kind||'html').toLowerCase();
    const s=getSettings();
    const safeUserPrompt=(kind==='svg'||kind==='json')?enforceSvgMetaHtmlPromptLimit(userPrompt):String(userPrompt||'');
    const body={model:s.model||'local-model',temperature:Number(s.temperature||0.25),messages:[{role:'system',content:String(systemPrompt||'')},{role:'user',content:safeUserPrompt}]};
    let last='';
    const endpoints=systemLLMEndpointList();
    if(!endpoints.length)throw new Error('No LLM endpoint available.');
    for(const endpoint of endpoints){
      try{
        if(statusEl)statusEl.textContent='Calling LLM: '+endpoint;
        const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({},body,{stream:false}))});
        const raw=await res.text();
        if(!res.ok)throw new Error('HTTP '+res.status+' '+raw.slice(0,500));
        return cleanAIOutput(kind,extractAssistantText(raw));
      }catch(e){last=endpoint+' -> '+cleanError(e);}
    }
    throw new Error(last||'LLM fetch failed.');
  }

  function collectFolderFiles(path){
    const fs=getFS();
    const root=getNode(fs,normPath(path));
    const out={};
    function walk(node,prefix){
      if(!node||node.type!=='dir')return;
      Object.keys(node.children||{}).forEach(name=>{
        const child=node.children[name];
        const rel=prefix?prefix+'/'+name:name;
        if(child.type==='file')out[rel]=String(child.content==null?'':child.content);
        else if(child.type==='dir')walk(child,rel);
      });
    }
    walk(root,'');
    return out;
  }

  async function importVaiosText(raw,statusEl,opts){
    opts=Object.assign({askToOpen:true,openAfter:false,silent:false},opts||{});
    const pkg=JSON.parse(String(raw||''));
    if(!pkg||pkg.kind!=='vaios-app-package'||!pkg.item)throw new Error('Not a .vaios app/widget package.');
    const original=pkg.item||{};
    const type=original.type==='widget'?'widget':'app';
    const importedName=uniqueImportedName(original.name,type);
    const files=pkg.files||{};
    const html=String(files['index.html']||files['/index.html']||files.indexHtml||files.html||original.html||((typeof original.html_base64==='string'&&original.html_base64.trim())?b64Decode(original.html_base64):''));
    if(!html.trim())throw new Error('.vaios package has no index.html/html content.');
    const htmlBytes=byteLen(html);
    const data=Object.assign({},original,{id:uid(type),name:importedName,entryName:importedName,baseName:importedName,parentId:original.id||'',createdAt:nowIso(),updatedAt:nowIso(),notes:(original.notes||'')+'\nImported from .vaios package.'});
    if(htmlBytes>LARGE_HTML_LIMIT){
      const key=largeHtmlKey(data.id);
      if(statusEl)statusEl.textContent='Large .vaios detected ('+humanBytes(htmlBytes)+'). Saving source to IndexedDB instead of localStorage...';
      await idbPutLarge(key,html);
      data.html='';data.externalHtmlKey=key;data.htmlSize=htmlBytes;
      data.notes+='\nLarge HTML source stored in IndexedDB to avoid localStorage quota.';
    }else{
      data.html=html;data.externalHtmlKey='';data.htmlSize=htmlBytes;
    }
    const item=makeItem(data);
    const all=getItems();
    all.unshift(item);
    setItems(all);
    const folder=itemFolder(item);
    Object.keys(files).forEach(rel=>{
      const clean=String(rel).replace(/^\/+/, '').replace(/\.\./g,'').replace(/\\/g,'/');
      if(!clean||clean==='index.html'||clean==='item.json'||clean==='manifest.json')return;
      try{writeFile(folder+'/'+clean,files[rel])}catch(e){perfState.lastStorageError='Extra file skipped during .vaios import: '+cleanError(e)}
    });
    try{syncItemsToFS(getItems())}catch(e){perfState.lastStorageError=cleanError(e)}
    renderAll();
    const msg='Imported .vaios: '+item.name+'\nFolder: '+folder+'\nHTML storage: '+(item.externalHtmlKey?'IndexedDB large-source store ('+humanBytes(htmlBytes)+')':'localStorage/filesystem');
    if(statusEl)statusEl.textContent=msg;
    if(!opts.silent)toast('Imported .vaios: '+item.name);
    playSound('save');
    if(item.type==='app'){
      if(opts.openAfter){openGeneratedApp(item)}
      else if(opts.askToOpen&&await osConfirm('Imported '+item.name+'.\n\nOpen it now?','Import Complete')){openGeneratedApp(item)}
    }
    return item;
  }

      const files=Array.from(ev.target.files||[]);

      if(statusEl)statusEl.textContent='Mass importing '+files.length+' .vaios file(s)...';
      prog.update(0,files.length,'Starting mass import...',logs);
      for(let i=0;i<files.length;i++){
        const f=files[i];

          prog.update(i,files.length,'Reading '+f.name+'...',logs);
          const raw=await readFileAsText(f);
          prog.update(i,files.length,'Importing '+f.name+'...',logs);
          const item=await importVaiosText(raw,statusEl,{askToOpen:false,openAfter:false,silent:true});
          ok++;logs.push('OK  '+f.name+' -> '+item.name);
        }catch(e){fail++;logs.push('ERR '+f.name+' -> '+cleanError(e));}
        prog.update(i+1,files.length,'Imported '+ok+' · Failed '+fail,logs);
        await new Promise(r=>setTimeout(r,20));
      }
      try{syncItemsToFS(getItems())}catch(e){perfState.lastStorageError=cleanError(e)}
      renderAll();
      const msg='Mass import complete. Imported: '+ok+'. Failed: '+fail+'.\n\n'+logs.join('\n');
      if(statusEl)statusEl.textContent=msg;
      prog.finish(ok,fail,logs);
      toast('Mass import complete: '+ok+' imported, '+fail+' failed.');
      playSound(fail?'error':'save');
      input.remove();
    });
    input.click();
  }

    let rows;
    try{rows=lines.map(line=>JSON.parse(line))}catch(e){throw new Error('Full JSONL validation failed: invalid JSON line.')}

    const one=kind=>{const found=rows.filter(row=>row&&row.kind===kind);if(found.length!==1)throw new Error('Full JSONL validation failed: expected one '+kind+' record.');return found[0]};

    const audit=one('backup-audit'),items=rows.filter(row=>row&&row.kind==='item');

    const hashes=new Map(audit.itemHashes.map(value=>[String(value.id),value]));
    for(const row of items){
      const data=row.data||{},html=String(data.html||'');

    }
    return true;
  }

  function playStartup(force){const s=getSettings();if(!force&&startupPlayed)return;startupPlayed=true;if(!s.soundsEnabled||s.startupSound==='off')return;if(s.startupSound==='beep'){tone(440,.08,0);tone(660,.08,.12);return}if(s.startupSound==='boot'){tone(330,.08,0);tone(495,.08,.09);tone(660,.12,.18);return}tone(392,.09,0,'sine',.015);tone(523,.11,.11,'sine',.015);tone(784,.16,.24,'sine',.012)}

  function updateGeneratedItem(id,patch){const all=getItems();let found=false;const next=all.map(x=>{if(x.id===id){found=true;return makeItem(Object.assign({},x,patch,{id:x.id,createdAt:x.createdAt,parentId:x.parentId,version:x.version}))}return x});if(found){setItems(next);return next.find(x=>x.id===id)}toast('Item not found.');return null}
  async function renameDesktopEntry(item){item=getItems().find(x=>x.id===(item&&item.id))||item;if(!item||item.open)return;const next=await osPrompt('Rename desktop icon, app/widget name, and menu entry:',item.entryName||item.name,'Rename');if(next===null)return;const name=cleanName(next);if(!name)return;updateGeneratedItem(item.id,{name:name,entryName:name,baseName:name});toast('Renamed to '+name)}
  async function deleteDesktopEntry(item){item=getItems().find(x=>x.id===(item&&item.id))||item;if(!item||item.open)return;if(!await osConfirm('Delete '+(item.name||item.entryName)+'? This removes the app/widget record and its generated folder from the registry.','Delete App'))return;const key=desktopIconKey(item);const folders=getDesktopFolders().map(f=>Object.assign({},f,{items:(f.items||[]).filter(x=>x!==key)}));safeSetLocalStorage(STORE.desktopFolders,JSON.stringify(folders),false);setItems(getItems().filter(x=>x.id!==item.id));toast('Deleted '+(item.name||item.entryName))}
  function openDesktopEntryEditor(item){item=getItems().find(x=>x.id===(item&&item.id))||item;if(!item||item.open){toast('Built-in system icons cannot be edited here.');return}const root=document.createElement('div');root.className='grid';root.innerHTML='<div class="card"><h2>Edit Desktop Entry</h2><div class="grid two"><div><label>Name</label><input id="de_name"></div><div><label>Menu / Icon Label</label><input id="de_entry"></div></div><label>Icon emoji / SVG / data:image</label><textarea id="de_icon" class="source" style="min-height:110px"></textarea><div class="grid two" style="margin-top:8px"><div><label>Category 1</label><input id="de_cat1"></div><div><label>Category 2</label><input id="de_cat2"></div></div><div class="grid two" style="margin-top:8px"><div><label>Type</label><select id="de_type"><option value="app">App</option><option value="widget">Widget</option></select></div><div><label>Show Desktop Icon</label><select id="de_desktop"><option value="true">Yes</option><option value="false">No</option></select></div></div><div class="grid two" style="margin-top:8px"><div><label>Preferred Width</label><input id="de_width" type="number" min="120" max="1600"></div><div><label>Preferred Height</label><input id="de_height" type="number" min="90" max="1200"></div></div><div class="row wrap" style="margin-top:12px"><button id="de_save" class="good">Save Entry</button><button id="de_rename" class="primary">Rename Name + Entry</button><button id="de_folder" class="ghost">Open Folder</button><button id="de_delete" class="bad">Delete</button></div><div id="de_status" class="status" style="margin-top:10px">Ready.</div></div>';createWindow('Edit Entry: '+(item.entryName||item.name),root,{w:660,h:620,x:90,y:50});root.querySelector('#de_name').value=item.name||'';root.querySelector('#de_entry').value=item.entryName||item.name||'';root.querySelector('#de_icon').value=item.icon||'';root.querySelector('#de_cat1').value=item.category1||'';root.querySelector('#de_cat2').value=item.category2||'';root.querySelector('#de_type').value=item.type||'app';root.querySelector('#de_desktop').value=String(item.desktopIcon!==false);root.querySelector('#de_width').value=item.preferredWidth||'';root.querySelector('#de_height').value=item.preferredHeight||'';root.querySelector('#de_save').onclick=()=>{const saved=updateGeneratedItem(item.id,{name:root.querySelector('#de_name').value,entryName:root.querySelector('#de_entry').value,icon:root.querySelector('#de_icon').value,category1:root.querySelector('#de_cat1').value,category2:root.querySelector('#de_cat2').value,type:root.querySelector('#de_type').value,desktopIcon:root.querySelector('#de_desktop').value==='true',preferredWidth:root.querySelector('#de_width').value,preferredHeight:root.querySelector('#de_height').value});root.querySelector('#de_status').textContent=saved?'Saved entry and synced filesystem.':'Save failed.'};root.querySelector('#de_rename').onclick=()=>{const name=cleanName(root.querySelector('#de_entry').value||root.querySelector('#de_name').value);if(name){root.querySelector('#de_name').value=name;root.querySelector('#de_entry').value=name;const saved=updateGeneratedItem(item.id,{name:name,entryName:name,baseName:name});root.querySelector('#de_status').textContent=saved?'Renamed name + menu entry + desktop label.':'Rename failed.'}};root.querySelector('#de_folder').onclick=()=>openComputer(itemFolder(getItems().find(x=>x.id===item.id)||item));root.querySelector('#de_delete').onclick=()=>deleteDesktopEntry(item)}
  function showContext(items,x,y,owner){contextMenu._openedAt=Date.now();contextMenu.dataset.owner=owner||'';contextMenu.innerHTML='';items.forEach(it=>{const b=document.createElement('button');b.textContent=it.label;b.onclick=(ev)=>{ev.preventDefault();ev.stopPropagation();contextMenu.classList.remove('show');delete contextMenu.dataset.owner;it.action&&it.action()};contextMenu.appendChild(b)});contextMenu.style.left=Math.max(4,Math.min(x,window.innerWidth-205))+'px';contextMenu.style.top=Math.max(4,Math.min(y,window.innerHeight-260))+'px';contextMenu.classList.add('show');playSound('menu')}
  function showDesktopIconMenu(item,x,y){
    if(item&&item.open){
      showContext([
        {label:'Open',action:()=>item.open()},
        {label:'Open System Folder',action:()=>openComputer('/Apps/System/'+slug(item.name))},

        {label:'Backup / Restore',action:openSaveRestoreWindow},
        {label:'Import .vaios',action:()=>chooseVaiosFile(null,{askToOpen:true})},{label:'Mass Import .vaios',action:()=>chooseVaiosFiles(null)},

      {label:'Duplicate',action:()=>{const copy=makeItem(Object.assign({},item,{id:null,name:item.name+' Copy',entryName:(item.entryName||item.name)+' Copy'}));const all=getItems();all.unshift(copy);setItems(all);toast('Duplicated '+item.name)}},
      {label:'Delete',action:()=>deleteDesktopEntry(item)},

  function osDialog(opts){
    opts=Object.assign({title:'VAiOS',message:'',kind:'alert',defaultValue:'',okText:'OK',cancelText:'Cancel'},opts||{});
    return new Promise(resolve=>{
      const root=document.createElement('div');
      root.className='grid';
      const hasInput=opts.kind==='prompt';
      root.innerHTML='<div class="card"><h2 style="margin:0 0 8px">'+escapeHtml(opts.title||'VAiOS')+'</h2><div class="status" style="min-height:54px">'+escapeHtml(opts.message||'')+'</div>'+(hasInput?'<label style="margin-top:9px">Value</label><input id="osdlg_input">':'')+'<div class="row wrap" style="justify-content:flex-end;margin-top:12px"><button id="osdlg_cancel" class="ghost">'+escapeHtml(opts.cancelText||'Cancel')+'</button><button id="osdlg_ok" class="primary">'+escapeHtml(opts.okText||'OK')+'</button></div></div>';
      const win=createWindow(opts.title||'VAiOS',root,{w:Math.min(520,window.innerWidth-18),h:hasInput?260:230,x:Math.max(8,(window.innerWidth-520)/2),y:90});
      const inp=root.querySelector('#osdlg_input');
      if(inp){inp.value=opts.defaultValue||'';setTimeout(()=>{try{inp.focus();inp.select()}catch(_){}},80)}
      let done=false;
      function close(val){if(done)return;done=true;try{windows.delete(win.dataset.id);win.remove();renderTasks()}catch(_){}resolve(val)}
      const closeBtn=win.querySelector('.win-controls button[title="Close"]');
      if(closeBtn)closeBtn.onclick=()=>close(hasInput?null:false);
      root.querySelector('#osdlg_cancel').onclick=()=>close(hasInput?null:false);
      root.querySelector('#osdlg_ok').onclick=()=>close(hasInput?(inp?inp.value:''):true);
      root.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&(ev.ctrlKey||!hasInput)){ev.preventDefault();root.querySelector('#osdlg_ok').click()}if(ev.key==='Escape'){ev.preventDefault();root.querySelector('#osdlg_cancel').click()}});
    });
  }
  function osConfirm(message,title){return osDialog({kind:'confirm',title:title||'Confirm',message:message,okText:'OK',cancelText:'Cancel'})}
  function osPrompt(message,defaultValue,title){return osDialog({kind:'prompt',title:title||'Input',message:message,defaultValue:defaultValue||'',okText:'OK',cancelText:'Cancel'})}
  function osAlert(message,title){return osDialog({kind:'alert',title:title||'Notice',message:message,okText:'OK',cancelText:'Close'})}
  function openMassImportProgress(total){
    const root=document.createElement('div');
    root.className='grid';
    root.innerHTML='<div class="card"><h2 style="margin:0 0 8px">Mass Import .vaios</h2><div class="status" id="mi_status">Preparing '+Number(total||0)+' file(s)...</div><div style="height:18px;border:2px inset #305d42;background:#031008;margin-top:10px;border-radius:8px;overflow:hidden"><div id="mi_bar" style="height:100%;width:0%;background:linear-gradient(90deg,#166534,#22c55e)"></div></div><div class="row" style="margin-top:8px"><span class="pill" id="mi_count">0 / '+Number(total||0)+'</span><span class="grow"></span><span class="pill" id="mi_pct">0%</span></div><textarea id="mi_log" class="source" readonly style="min-height:220px;margin-top:10px"></textarea></div>';
    const win=createWindow('Mass Import .vaios',root,{w:660,h:470,x:Math.max(8,(window.innerWidth-680)/2),y:64});
    const st=root.querySelector('#mi_status'),bar=root.querySelector('#mi_bar'),cnt=root.querySelector('#mi_count'),pct=root.querySelector('#mi_pct'),log=root.querySelector('#mi_log');
    return {root,win,update(done,total,msg,lines){const p=total?Math.round(done/total*100):0;st.textContent=msg||('Importing '+done+' of '+total+'...');bar.style.width=Math.max(0,Math.min(100,p))+'%';cnt.textContent=done+' / '+total;pct.textContent=p+'%';if(lines)log.value=lines.join('\n');log.scrollTop=log.scrollHeight;},finish(ok,fail,lines){this.update(ok+fail,total,'Mass import complete. Imported: '+ok+'. Failed: '+fail+'.',lines);}};
  }

  function toast(msg){const t=$('toast');t.textContent=String(msg||'');t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),3000)}
  function cleanError(err){if(!err)return'Unknown error';if(typeof err==='string')return err;if(err.message)return err.message;try{return JSON.stringify(err)}catch(e){return String(err)}}
  function hideMenus(){startMenu.classList.remove('show');widgetMenu.classList.remove('show');contextMenu.classList.remove('show');delete contextMenu.dataset.owner}
  function tickClock(){const s=getSettings(),d=new Date();const opts={hour:'2-digit',minute:'2-digit',hour12:s.clockFormat!=='24'};if(s.clockSeconds)opts.second='2-digit';if(s.clockZone==='utc')opts.timeZone='UTC';const time=d.toLocaleTimeString([],opts);let date='';if(s.clockDate==='short')date=d.toLocaleDateString([],{month:'short',day:'numeric',timeZone:s.clockZone==='utc'?'UTC':undefined});if(s.clockDate==='long')date=d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric',timeZone:s.clockZone==='utc'?'UTC':undefined});if(s.clockZone==='utc'&&date)date+=' UTC';$('clock').innerHTML='<strong>'+escapeHtml(time)+'</strong><span>'+escapeHtml(date)+'</span>'}
  function seedIfEmpty(){return}
  function purgeDemoJunk(){
    const bad=new Set(['Counter','Clock Widget']);
    const items=getItems().filter(i=>!(bad.has(i.name)&&(!i.notes||/sample|demo|created/i.test(String(i.notes||'')))));
    if(items.length!==getItems().length)safeSetLocalStorage(STORE.items,JSON.stringify(items),true);
  }
  function sampleCounterHtml(){return '<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font-family:system-ui;background:#052e16;color:#e6f7ed;display:grid;place-items:center;min-height:100vh}.box{border:2px solid #86efac;background:#07140d;padding:24px;text-align:center}button{background:#14532d;color:white;border:1px solid #86efac;padding:10px 14px;margin:4px}#n{font-size:60px;font-weight:900}</style></head><body><div class="box"><h1>Counter</h1><div id="n">0</div><button onclick="set(-1)">-</button><button onclick="set(1)">+</button><button onclick="localStorage.setItem(\'counter_app_value\',0);draw()">Reset</button><button onclick="VDesktop.saveLocalStorage(\'counter-storage.json\')">Save LS</button></div><script>function draw(){n.textContent=localStorage.getItem(\'counter_app_value\')||0}function set(d){localStorage.setItem(\'counter_app_value\',Number(localStorage.getItem(\'counter_app_value\')||0)+d);draw()}draw()<\/script></body></html>'}
  function sampleClockHtml(){return '<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font-family:system-ui;background:#020604;color:#e6f7ed;display:grid;place-items:center;min-height:100vh}.time{font-size:38px;font-weight:900;color:#86efac}.date{color:#95b6a1}</style></head><body><div><div class="time" id="t"></div><div class="date" id="d"></div></div><script>function tick(){const x=new Date();t.textContent=x.toLocaleTimeString([],{hour:\'2-digit\',minute:\'2-digit\'});d.textContent=x.toLocaleDateString()}setInterval(tick,1000);tick()<\/script></body></html>'}

  $('startBtn').onclick=()=>{widgetMenu.classList.remove('show');startMenu.classList.toggle('show');playSound('menu')};$('closeStart').onclick=hideMenus;$('closeWidgets').onclick=hideMenus;$('quickDownload').onclick=openSaveRestoreWindow;$('topFullscreen').onclick=()=>{try{if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}else{document.exitFullscreen&&document.exitFullscreen()}}catch(e){toast(cleanError(e))}};$('sysMon').ondblclick=openTaskManager;desktop.addEventListener('click',e=>{if(e.target===desktop)hideMenus()});desktop.addEventListener('contextmenu',e=>{if(e.target===desktop){e.preventDefault();showContext([{label:'Open Computer',action:()=>openComputer('__home__')},{label:'Open Disk',action:()=>openComputer('/')},{label:'Task Manager',action:openTaskManager},{label:'Disk Stats',action:openDiskStats},{label:'New App / Widget',action:openBuilder},{label:'New Text Document',action:()=>openTextEditor('/Documents/untitled-'+Date.now()+'.txt')},{label:'New Desktop Folder',action:createDesktopFolder},{label:'Import .vaios App/Widget',action:()=>chooseVaiosFile(null,{askToOpen:true})},{label:'Mass Import .vaios',action:()=>chooseVaiosFiles(null)},{label:'Download JSONL Backup',action:downloadLatestJsonl},{label:'Fullscreen',action:()=>$('topFullscreen').click()},{label:'Refresh',action:renderAll}],e.clientX,e.clientY)}});document.addEventListener('click',e=>{if(Date.now()-(contextMenu._openedAt||0)<180)return;if(e.target&&e.target.closest&&e.target.closest('.context-menu,.app-menu-btn,.widget-menu-btn,.widget-grip,.widget-window-grip'))return;if(!contextMenu.contains(e.target)){contextMenu.classList.remove('show');delete contextMenu.dataset.owner}});setInterval(()=>{tickClock();updateSystemMonitor()},1000);
  migrateOldStores();seedIfEmpty();purgeDemoJunk();ensureSystemWidgets();safeSetLocalStorage(STORE.items,JSON.stringify(normalizeItems(getItems())),true);safeSetLocalStorage(STORE.desktopFolders,JSON.stringify(sanitizeDesktopFolders(getDesktopFolders())),false);try{pruneDesktopFoldersForItems(getItems());syncItemsToFS(getItems());syncDesktopFoldersToFS()}catch(e){perfState.lastStorageError=cleanError(e)}applySettings();renderAll();tickClock();updateSystemMonitor();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});setTimeout(()=>playStartup(false),550);
})();
